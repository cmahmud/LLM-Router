name: FreeBuff P2 Validation
# Temporary branch-only validation; remove before merge.

on:
  push:
    branches:
      - freebuff-p2-lifecycle

permissions:
  contents: read

env:
  OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
  DISABLE_SQLITE_AUTO_BACKUP: "true"

jobs:
  validate:
    name: Focused lifecycle gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: ./.github/actions/npm-ci-retry

      - name: Focused FreeBuff unit tests
        run: >-
          node --import tsx/esm --test
          tests/unit/freebuff-provider.test.ts
          tests/unit/freebuff-transport.test.ts
          tests/unit/freebuff-executor-lifecycle.test.ts
          tests/unit/freebuff-session-manager.test.ts
          tests/unit/freebuff-run-manager.test.ts
          tests/unit/freebuff-concurrency.test.ts

      - name: Open-SSE typecheck
        run: npm run check:open-sse-typecheck

      - name: Core typecheck
        run: npm run typecheck:core

      - name: Targeted ESLint
        run: >-
          npx eslint
          open-sse/executors/freebuff.ts
          open-sse/executors/freebuff/client.ts
          open-sse/executors/freebuff/errors.ts
          open-sse/executors/freebuff/request.ts
          open-sse/executors/freebuff/runManager.ts
          open-sse/executors/freebuff/runtime.ts
          open-sse/executors/freebuff/schemas.ts
          open-sse/executors/freebuff/sessionManager.ts
          open-sse/executors/freebuff/types.ts
          tests/unit/freebuff-provider.test.ts
          tests/unit/freebuff-transport.test.ts
          tests/unit/freebuff-executor-lifecycle.test.ts
          tests/unit/freebuff-session-manager.test.ts
          tests/unit/freebuff-run-manager.test.ts
          tests/unit/freebuff-concurrency.test.ts
          tests/unit/helpers/freebuff-fixtures.ts
          --suppressions-location config/quality/eslint-suppressions.json

      - name: Prettier
        run: >-
          npx prettier --check
          open-sse/executors/freebuff.ts
          open-sse/executors/freebuff/client.ts
          open-sse/executors/freebuff/errors.ts
          open-sse/executors/freebuff/request.ts
          open-sse/executors/freebuff/runManager.ts
          open-sse/executors/freebuff/runtime.ts
          open-sse/executors/freebuff/schemas.ts
          open-sse/executors/freebuff/sessionManager.ts
          open-sse/executors/freebuff/types.ts
          tests/unit/freebuff-provider.test.ts
          tests/unit/freebuff-transport.test.ts
          tests/unit/freebuff-executor-lifecycle.test.ts
          tests/unit/freebuff-session-manager.test.ts
          tests/unit/freebuff-run-manager.test.ts
          tests/unit/freebuff-concurrency.test.ts
          tests/unit/helpers/freebuff-fixtures.ts

      - name: Diff whitespace check
        run: git diff --check dev...HEAD
